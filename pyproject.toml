[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "falabr"
version = "0.1.0"
description = "Brazilian Portuguese text normalization for text-to-speech"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hadagalberto Junior" }]
keywords = ["portuguese", "pt-br", "tts", "text-normalization", "numbers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
falabr = "falabr.cli:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8",
  "hypothesis>=6",
  "coverage>=7",
  "build>=1",
]

[project.urls]
Homepage = "https://github.com/hadagalberto/falabr"
Issues = "https://github.com/hadagalberto/falabr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/falabr"]

[tool.hatch.build.targets.sdist]
include = [
  "src/falabr",
  "tests",
  "pyproject.toml",
  "README.md",
  "README.en.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  ".github",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
files = ["src/falabr", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["falabr"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
